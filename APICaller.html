<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Authorize 測試頁</title>
</head>
<body>
    <h2>Authorize API 測試</h2>

    <div>
        <label for="name">Name：</label>
        <input id="name" type="text" value="JD1">
    </div>
    <div>
        <label for="password">Password：</label>
        <input id="password" type="password" value="123456789">
    </div>
    <br>
    <button onclick="callApi()">送出</button>

    <h3>回傳結果：</h3>
    <pre id="result"></pre>

    <h3>回傳值部分內容：</h3>
    <div id="parsed"></div>

    <script>
        async function callApi() {
            const name = document.getElementById('name').value;
            const password = document.getElementById('password').value;
            const resultEl = document.getElementById('result');
            resultEl.textContent = '呼叫中...';

            try {
                const response = await fetch('https://localhost:7298/Authorize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: name,
                        password: password
                    })
                });

                const result = await response.json();
                resultEl.textContent = JSON.stringify(result, null, 2);

                document.getElementById('parsed').innerHTML = `
                        <strong>Message:</strong> ${result.message} <br>
                        <strong>User Name:</strong> ${result.data.name} <br>
                        <strong>Password:</strong> ${result.data.password}
                    `;

            } catch (err) {
                resultEl.textContent = '錯誤：' + err;
            }
        }
    </script>
</body>
</html>
