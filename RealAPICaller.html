<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訊息系統 Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            position: relative;
        }

            .header h1 {
                font-size: 2.5em;
                margin-bottom: 10px;
            }

        .user-status {
            position: absolute;
            top: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

            .user-status.logged-out {
                color: #999;
            }

            .user-status.logged-in {
                color: #155724;
                background: #d4edda;
                border: 2px solid #c3e6cb;
            }

            .user-status strong {
                display: block;
                margin-bottom: 5px;
                font-size: 12px;
                text-transform: uppercase;
            }

            .user-status .user-name {
                font-size: 16px;
                font-weight: bold;
            }

            .user-status button {
                margin-top: 10px;
                padding: 8px 20px;
                background: #dc3545;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-size: 14px;
                width: 100%;
            }

                .user-status button:hover {
                    background: #c82333;
                }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 15px;
            background: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

            .tab:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            }

            .tab.active {
                background: #667eea;
                color: white;
            }

        .content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .section {
            display: none;
        }

            .section.active {
                display: block;
            }

        .form-group {
            margin-bottom: 20px;
        }

            .form-group label {
                display: block;
                margin-bottom: 8px;
                font-weight: bold;
                color: #333;
            }

            .form-group input,
            .form-group textarea {
                width: 100%;
                padding: 12px;
                border: 2px solid #ddd;
                border-radius: 8px;
                font-size: 14px;
                transition: border-color 0.3s;
            }

                .form-group input:focus,
                .form-group textarea:focus {
                    outline: none;
                    border-color: #667eea;
                }

            .form-group textarea {
                min-height: 100px;
                resize: vertical;
            }

        .btn {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

            .btn:hover:not(:disabled) {
                background: #5568d3;
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            }

            .btn:disabled {
                background: #ccc;
                cursor: not-allowed;
            }

        .btn-secondary {
            background: #6c757d;
            margin-left: 10px;
        }

            .btn-secondary:hover {
                background: #5a6268;
            }

        .message-list {
            margin-top: 30px;
        }

        .message-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

            .message-item h3 {
                color: #667eea;
                margin-bottom: 10px;
            }

            .message-item p {
                color: #666;
                line-height: 1.6;
                margin-bottom: 10px;
            }

        .message-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .filter-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📬 訊息系統</h1>
            <p>使用者管理與訊息發布平台</p>

            <div class="user-status" id="userStatus">
                <strong>登入狀態</strong>
                <div class="user-name" id="userStatusText">未登入</div>
                <button id="logoutBtn" style="display: none;" onclick="logout()">登出</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('register', event)">註冊</button>
            <button class="tab" onclick="showTab('login', event)">登入</button>
            <button class="tab" onclick="showTab('publish', event)">發布訊息</button>
            <button class="tab" onclick="showTab('messages', event)">訊息列表</button>
        </div>

        <div class="content">
            <div id="alertContainer"></div>

            <!-- 註冊區塊 -->
            <div id="register" class="section active">
                <h2>📝 使用者註冊</h2>
                <form onsubmit="register(event)">
                    <div class="form-group">
                        <label>姓名:</label>
                        <input type="text" id="regName" required>
                    </div>
                    <div class="form-group">
                        <label>Gmail:</label>
                        <input type="Gmail" id="regGmail" required>
                    </div>
                    <div class="form-group">
                        <label>密碼:</label>
                        <input type="password" id="regPassword" required>
                    </div>
                    <button type="submit" class="btn" id="regBtn">註冊</button>
                </form>
            </div>

            <!-- 登入區塊 -->
            <div id="login" class="section">
                <h2>🔐 使用者登入</h2>
                <form onsubmit="authorize(event)">
                    <div class="form-group">
                        <label>姓名:</label>
                        <input type="text" id="authName" required>
                    </div>
                    <div class="form-group">
                        <label>密碼:</label>
                        <input type="password" id="authPassword" required>
                    </div>
                    <button type="submit" class="btn" id="authBtn">登入</button>
                </form>
            </div>

            <!-- 發布訊息區塊 -->
            <div id="publish" class="section">
                <h2>✉️ 發布訊息</h2>
                <form onsubmit="releaseMessage(event)">
                    <div class="form-group">
                        <label>主旨:</label>
                        <input type="text" id="msgSubject" required>
                    </div>
                    <div class="form-group">
                        <label>內容:</label>
                        <textarea id="msgContent" required></textarea>
                    </div>
                    <button type="submit" class="btn" id="releaseBtn">發布訊息</button>
                </form>
            </div>

            <!-- 訊息列表區塊 -->
            <div id="messages" class="section">
                <h2>📋 訊息列表</h2>
                <div class="filter-section">
                    <div class="form-group">
                        <label>搜尋發布者名稱:</label>
                        <input type="text" id="searchName" placeholder="輸入名稱進行搜尋 (留空顯示全部)">
                    </div>
                    <button class="btn" onclick="loadMessages()">搜尋</button>
                    <button class="btn btn-secondary" onclick="clearSearch()">清除</button>
                </div>
                <div id="messageList" class="message-list">
                    <div class="empty-state">
                        <p>📭 點擊「搜尋」按鈕載入訊息列表</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://localhost:7298';

        // 儲存當前登入的使用者
        let currentUser = null;

        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 5000);
        }

        function showTab(tabName, event) {
            // 更新標籤樣式
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            // 更新內容區塊
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(tabName).classList.add('active');
        }

        function updateUserStatus() {
            const userStatus = document.getElementById('userStatus');
            const userStatusText = document.getElementById('userStatusText');
            const logoutBtn = document.getElementById('logoutBtn');

            if (currentUser) {
                userStatus.classList.remove('logged-out');
                userStatus.classList.add('logged-in');
                userStatusText.textContent = currentUser.name;
                logoutBtn.style.display = 'block';
            } else {
                userStatus.classList.remove('logged-in');
                userStatus.classList.add('logged-out');
                userStatusText.textContent = '未登入';
                logoutBtn.style.display = 'none';
            }
        }

        function logout() {
            currentUser = null;
            updateUserStatus();
            showAlert('已登出', 'info');
        }

        async function register(event) {
            event.preventDefault();

            const btn = document.getElementById('regBtn');
            btn.disabled = true;
            btn.textContent = '註冊中...';

            const userData = {
                name: document.getElementById('regName').value,
                gmail: document.getElementById('regGmail').value,
                password: document.getElementById('regPassword').value
            };

            try {
                const response = await fetch(`${API_BASE}/Register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(userData)
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert(`✅ ${result.message}`, 'success');
                    event.target.reset();
                    console.log('註冊成功:', result);
                } else {
                    showAlert(`❌ ${result.message}`, 'error');
                    console.log('註冊失敗:', result);
                }
            } catch (error) {
                showAlert(`❌ 連線錯誤: ${error.message}`, 'error');
                console.error('註冊錯誤:', error);
            } finally {
                btn.disabled = false;
                btn.textContent = '註冊';
            }
        }

        async function authorize(event) {
            event.preventDefault();

            const btn = document.getElementById('authBtn');
            btn.disabled = true;
            btn.textContent = '登入中...';

            const authData = {
                name: document.getElementById('authName').value,
                password: document.getElementById('authPassword').value
            };

            try {
                const response = await fetch(`${API_BASE}/Authorize`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(authData)
                });

                const result = await response.json();

                if (response.ok && result.message !== "User is not authorized") {
                    currentUser = result.data;
                    updateUserStatus();
                    showAlert(`✅ ${result.message}`, 'success');
                    event.target.reset();
                    console.log('登入成功:', result);
                } else {
                    showAlert(`❌ ${result.message}`, 'error');
                    console.log('登入失敗:', result);
                }
            } catch (error) {
                showAlert(`❌ 連線錯誤: ${error.message}`, 'error');
                console.error('登入錯誤:', error);
            } finally {
                btn.disabled = false;
                btn.textContent = '登入';
            }
        }

        async function releaseMessage(event) {
            event.preventDefault();

            // 檢查是否已登入
            if (!currentUser) {
                showAlert('❌ 請先登入才能發布訊息', 'error');
                return;
            }

            const btn = document.getElementById('releaseBtn');
            btn.disabled = true;
            btn.textContent = '發布中...';

            const messageData = {
                subject: document.getElementById('msgSubject').value,
                content: document.getElementById('msgContent').value,
                publisher: currentUser.name,
                publishTime: new Date().toISOString()
            };

            try {
                const response = await fetch(`${API_BASE}/Release`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(messageData)
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert(`✅ ${result.message}`, 'success');
                    event.target.reset();
                    console.log('訊息發布:', result);
                } else {
                    showAlert(`❌ ${result.message}`, 'error');
                    console.log('發布失敗:', result);
                }
            } catch (error) {
                showAlert(`❌ 連線錯誤: ${error.message}`, 'error');
                console.error('發布錯誤:', error);
            } finally {
                btn.disabled = false;
                btn.textContent = '發布訊息';
            }
        }

        async function loadMessages() {
            const searchName = document.getElementById('searchName').value.trim();
            const messageList = document.getElementById('messageList');

            messageList.innerHTML = '<p class="loading">⏳ 載入中...</p>';

            try {
                // 如果有搜尋名稱就加上參數,否則不加
                const url = searchName
                    ? `${API_BASE}/MessageList?name=${encodeURIComponent(searchName)}`
                    : `${API_BASE}/MessageList?name=`;

                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (response.ok && result.data && result.data.length > 0) {
                    messageList.innerHTML = result.data.map(msg => `
                            <div class="message-item">
                                <h3>${msg.subject}</h3>
                                <p>${msg.content}</p>
                                <div class="message-meta">
                                    <span>👤 發布者: ${msg.publisher}</span>
                                    <span>🕐 ${new Date(msg.publishTime).toLocaleString('zh-TW')}</span>
                                </div>
                            </div>
                        `).join('');

                    showAlert(`✅ ${result.message}`, 'success');
                    console.log('載入訊息:', result);
                } else {
                    messageList.innerHTML = '<div class="empty-state"><p>📭 目前沒有訊息</p></div>';
                    if (result.message) {
                        showAlert(result.message, 'info');
                    }
                }
            } catch (error) {
                messageList.innerHTML = '<div class="empty-state"><p>❌ 載入失敗</p></div>';
                showAlert(`❌ 連線錯誤: ${error.message}`, 'error');
                console.error('載入錯誤:', error);
            }
        }

        function clearSearch() {
            document.getElementById('searchName').value = '';
            loadMessages();
        }

        // 初始化使用者狀態
        updateUserStatus();
    </script>
</body>
</html>
